// Applied to every build in the composite, including Flutter's included :gradle
// build. That build otherwise resolves its Kotlin plugin from the Gradle Plugin
// Portal and Maven Central directly, where shared CI runner IPs receive HTTP 429.
beforeSettings { settings ->
    def pluginMirrors = [
        "https://repo1.maven.org/maven2",
        "https://maven-central.storage-download.googleapis.com/maven2/",
    ]
    def projectMirrors = [
        "https://repo1.maven.org/maven2",
        "https://maven-central.storage-download.googleapis.com/maven2/",
    ]

    settings.pluginManagement.repositories.clear()
    settings.pluginManagement.repositories {
        pluginMirrors.each { mirror -> maven { url = uri(mirror) } }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    // Flutter's included build asks for the Kotlin DSL plugin by its marker,
    // which lives only on the Gradle Plugin Portal. That portal is also rate
    // limited from shared runners, so resolve the implementation module directly
    // from Maven Central when the marker is requested.
    settings.pluginManagement.resolutionStrategy.eachPlugin {
        if (requested.id.id == 'org.gradle.kotlin.kotlin-dsl' && requested.version != null) {
            useModule("org.gradle.kotlin:gradle-kotlin-dsl-plugins:${requested.version}")
        }
    }

    settings.dependencyResolutionManagement.repositories.clear()
    settings.dependencyResolutionManagement.repositories {
        projectMirrors.each { mirror -> maven { url = uri(mirror) } }
        google()
        mavenCentral()
    }
}
