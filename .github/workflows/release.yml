name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.0.0). Defaults to the selected ref."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [ -z "$raw" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              raw="${{ github.ref_name }}"
            else
              raw="0.0.0"
            fi
          fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$raw' (expected a tag like v1.0.0)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building OTDA $version"

      - name: Install dependencies
        run: flutter pub get

      # Gradle resolves its own plugin classpath (Kotlin DSL, the Flutter plugin
      # loader) from Maven Central on every cold run, and Maven Central rate-limits
      # shared runner IPs with HTTP 429. Caching the resolution means most runs do
      # not ask at all; the retries below cover the cold one.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'android/gradle.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=release.keystore
          EOF

      - name: Warn when unsigned
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the APKs will be signed with the debug key."

      - name: Test
        run: flutter test --exclude-tags integration

      - name: Install Gradle repository mirrors
        run: |
          mkdir -p ~/.gradle/init.d
          cp tool/gradle/mirrors.init.gradle ~/.gradle/init.d/otda-mirrors.gradle

      - name: Build release APKs
        env:
          # Gradle's own repository retries; harmless if a future version drops them.
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=6
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          # A 429 from Maven Central is transient: retry the build instead of
          # failing the release, up to three attempts with a growing pause.
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error title=Dependency download failed::gave up after 3 attempts"
                return 1
              fi
              echo "::warning title=Dependency download throttled::attempt $attempt failed; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            done
          }

          retry flutter build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "otda-${{ steps.version.outputs.version }}-universal.apk"

          retry flutter build apk --release --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "otda-${{ steps.version.outputs.version }}-${abi}.apk"
          done

      - name: Build AAB for Play
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=6
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build appbundle --release \
                 --build-name "${{ steps.version.outputs.version }}" \
                 --build-number "${{ github.run_number }}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error title=AAB build failed::gave up after 3 attempts"
              exit 1
            fi
            echo "::warning title=Dependency download throttled::attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          cp build/app/outputs/bundle/release/app-release.aab \
             "otda-${{ steps.version.outputs.version }}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otda-${{ steps.version.outputs.version }}
          path: |
            otda-${{ steps.version.outputs.version }}-universal.apk
            otda-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            otda-${{ steps.version.outputs.version }}-arm64-v8a.apk
            otda-${{ steps.version.outputs.version }}-x86_64.apk
            otda-${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OTDA v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            otda-${{ steps.version.outputs.version }}-universal.apk
            otda-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            otda-${{ steps.version.outputs.version }}-arm64-v8a.apk
            otda-${{ steps.version.outputs.version }}-x86_64.apk
            otda-${{ steps.version.outputs.version }}.aab
          generate_release_notes: true
          prerelease: true
