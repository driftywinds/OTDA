name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.0.0). Defaults to the selected ref."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [ -z "$raw" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              raw="${{ github.ref_name }}"
            else
              raw="0.0.0"
            fi
          fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$raw' (expected a tag like v1.0.0)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building OTDA $version"

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=release.keystore
          EOF

      - name: Warn when unsigned
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the APKs will be signed with the debug key."

      - name: Test
        run: flutter test --exclude-tags integration

      - name: Build release APKs
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "otda-${{ steps.version.outputs.version }}-universal.apk"

          flutter build apk --release --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "otda-${{ steps.version.outputs.version }}-${abi}.apk"
          done

      - name: Build AAB for Play
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ github.run_number }}"
          cp build/app/outputs/bundle/release/app-release.aab \
             "otda-${{ steps.version.outputs.version }}.aab"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otda-${{ steps.version.outputs.version }}
          path: |
            otda-${{ steps.version.outputs.version }}-universal.apk
            otda-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            otda-${{ steps.version.outputs.version }}-arm64-v8a.apk
            otda-${{ steps.version.outputs.version }}-x86_64.apk
            otda-${{ steps.version.outputs.version }}.aab
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: OTDA v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            otda-${{ steps.version.outputs.version }}-universal.apk
            otda-${{ steps.version.outputs.version }}-armeabi-v7a.apk
            otda-${{ steps.version.outputs.version }}-arm64-v8a.apk
            otda-${{ steps.version.outputs.version }}-x86_64.apk
            otda-${{ steps.version.outputs.version }}.aab
          generate_release_notes: true
          prerelease: true
