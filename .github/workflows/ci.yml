name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log || {
            grep -Ei "error|warning" /tmp/analyze.log | while IFS= read -r line; do
              echo "::error title=Flutter analyze::$line"
            done
            exit 1
          }

      # The integration tests talk to a real OpenTodo server; they are tagged and
      # run locally against .tmp/server instead.
      - name: Test
        run: flutter test --exclude-tags integration

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gradle resolves its own plugin classpath (Kotlin DSL, the Flutter plugin
      # loader) from Maven Central on every cold run, and Maven Central rate-limits
      # shared runner IPs with HTTP 429. Caching the resolution means most runs do
      # not ask at all; the retry below covers the cold one.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts', 'android/gradle.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-v3-${{ runner.os }}-

      - name: Install Gradle repository mirrors
        run: |
          mkdir -p ~/.gradle/init.d
          cp tool/gradle/mirrors.init.gradle ~/.gradle/init.d/otda-mirrors.gradle

      - name: Build release APK
        shell: bash
        env:
          # Gradle's own repository retries; harmless if a future version drops them.
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.repository.max.retries=6
            -Dorg.gradle.internal.repository.initial.backoff=2000
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release 2>&1 | tee /tmp/android-build.log; then
              exit 0
            fi
            if grep -qiE '429|Too Many Requests|Could not resolve|Could not GET' /tmp/android-build.log && [ "$attempt" -lt 3 ]; then
              echo "::warning title=Dependency download throttled::attempt $attempt hit a repository error; retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
              continue
            fi
            grep -nE '(^e: |error:|FAILURE:|What went wrong)' /tmp/android-build.log | while IFS= read -r line; do
              echo "::error title=Android build::$line"
            done
            exit 1
          done
          echo "::error title=Android build::gave up after 3 attempts"
          exit 1
