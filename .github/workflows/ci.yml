name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log || {
            grep -Ei "error|warning" /tmp/analyze.log | while IFS= read -r line; do
              echo "::error title=Flutter analyze::$line"
            done
            exit 1
          }

      # The integration tests talk to a real OpenTodo server; they are tagged and
      # run locally against .tmp/server instead.
      - name: Test
        run: flutter test --exclude-tags integration

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/android-build.log || {
            grep -nE '(^e: |error:|FAILURE:|What went wrong)' /tmp/android-build.log | while IFS= read -r line; do
              echo "::error title=Android build::$line"
            done
            exit 1
          }
